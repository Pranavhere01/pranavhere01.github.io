<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..700&family=JetBrains+Mono:wght@500&family=Poppins:wght@500&display=block">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #15143F; }
  .og { position: relative; width: 1200px; height: 630px; background: linear-gradient(120deg, #4B47B5 0%, #2F2E7A 45%, #15143F 100%); color: #FCF7EF; font-family: "Schibsted Grotesk", Arial, sans-serif; overflow: hidden; }
  .chart { position: absolute; right: 90px; top: -60px; width: 520px; height: 520px; opacity: .28; }
  .stack { position: absolute; left: 96px; top: 120px; display: flex; flex-direction: column; gap: 24px; }
  .lock { display: flex; align-items: center; gap: 12px; }
  .lock img { width: 56px; height: 56px; display: block; }
  .lock .v { font-weight: 600; font-size: 20px; }
  .lock .v span[lang="hi"] { font-family: Poppins, sans-serif; font-weight: 500; color: #F6EBD0; }
  .lock .t { font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: rgba(252,247,239,.62); padding-left: 12px; border-left: 1px solid rgba(252,247,239,.3); }
  h1 { margin: 0; font-weight: 700; font-size: 96px; letter-spacing: -.025em; line-height: 1; }
  p { margin: 0; font-size: 26px; line-height: 1.4; color: rgba(252,247,239,.78); max-width: 720px; }
</style>
</head>
<body>
<div class="og">
  <svg class="chart" viewBox="0 0 200 200" fill="none" stroke="#D4A64A" stroke-width="1" aria-hidden="true"><rect x="1" y="1" width="198" height="198"/><path d="M1 1L199 199M199 1L1 199M100 1L199 100L100 199L1 100Z"/></svg>
  <div class="stack">
    <div class="lock">
      <img src="saarthi-emblem.svg" alt="">
      <div class="v">Saarthi · <span lang="hi">सारथी</span></div>
      <div class="t">Founder &amp; CEO</div>
    </div>
    <h1>Pranav Kumar</h1>
    <p>Your charioteer through the stars. An astrologer grounded in your exact chart, built on a deterministic engine.</p>
  </div>
</div>
</body>
</html>
